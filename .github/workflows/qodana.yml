name: Qodana

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/qodana.yml"
      - "composer.json"
      - "phpstan.neon"
      - "phpunit.xml.dist"
      - "qodana.yaml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/qodana.yml"
      - "composer.json"
      - "phpstan.neon"
      - "phpunit.xml.dist"
      - "qodana.yaml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

jobs:
  qodana:
    runs-on: ubuntu-latest

    steps:
      - name: Skip Qodana when token is not configured
        if: "${{ env.QODANA_TOKEN == '' }}"
        run: echo "QODANA_TOKEN is not configured; skipping Qodana scan."

      - name: Checkout repository
        if: "${{ env.QODANA_TOKEN != '' }}"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Run Qodana
        if: "${{ env.QODANA_TOKEN != '' }}"
        uses: JetBrains/qodana-action@v2026.1
        with:
          args: --within-docker false
