name: Telegram API currency

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Check Telegram Bot API surface
        run: composer check:telegram-api-surface
