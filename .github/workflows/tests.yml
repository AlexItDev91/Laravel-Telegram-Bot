name: Composer checks

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tests.yml"
      - "composer.json"
      - "phpstan.neon"
      - "phpunit.xml.dist"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "VERSION"
  pull_request:
    paths:
      - ".github/workflows/tests.yml"
      - "composer.json"
      - "phpstan.neon"
      - "phpunit.xml.dist"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate package metadata
        run: composer validate --no-check-publish --no-interaction

      - name: Run static analysis
        run: composer analyse

      - name: Check Telegram Bot API surface
        run: composer check:telegram-api-surface

      - name: Run tests
        run: composer test

      - name: Run API surface coverage tests
        run: composer test:coverage-surface
