name: Generate Writerside docs

on:
  push:
    branches: ["main"]
    paths:
      - "Writerside/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "VERSION"
      - "scripts/build-writerside-static-search.php"
      - ".github/workflows/writerside.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  INSTANCE: 'Writerside/tg'
  DOCKER_VERSION: '2026.04.8711'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Define Writerside artifact id
        run: |
          INSTANCE_ID="${INSTANCE#*/}"
          INSTANCE_ID_UPPER=$(echo "$INSTANCE_ID" | tr '[:lower:]' '[:upper:]')
          ARTIFACT="webHelp${INSTANCE_ID_UPPER}2-all.zip"

          echo "INSTANCE_ID_UPPER=$INSTANCE_ID_UPPER" >> "$GITHUB_ENV"
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Generate docs using Writerside Docker builder
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ env.INSTANCE }}
          docker-version: ${{ env.DOCKER_VERSION }}

      - name: Unpack Writerside website
        run: unzip -O UTF-8 -qq "artifacts/${ARTIFACT}" -d site

      - name: Build static documentation search
        run: php scripts/build-writerside-static-search.php site

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
